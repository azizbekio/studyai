<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyAI — Admin</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{--bg:#0d1b2a;--surface:#13263a;--surface2:#182f48;--border:#22415f;--text:#eaf3fb;--text2:#8fb0cc;--gold:#3b9eff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);padding:28px 18px;min-height:100vh}
.wrap{max-width:1000px;margin:0 auto}
h1{font-size:22px;margin-bottom:4px}
.sub{color:var(--text2);font-size:13px;margin-bottom:22px}
input{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:14px;width:260px;max-width:100%}
button{background:var(--gold);color:#04101c;border:none;border-radius:8px;padding:10px 18px;font-weight:600;cursor:pointer;margin-left:8px}
.tab{background:var(--surface2);border:1px solid var(--border);color:var(--text2);border-radius:8px;padding:8px 16px;margin-right:8px;margin-left:0;cursor:pointer;font-weight:500}
.tab.active{background:var(--gold);color:#04101c;border-color:var(--gold)}
table{width:100%;border-collapse:collapse;margin-top:20px;font-size:13px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
th{color:var(--text2);font-weight:600;font-size:11.5px;text-transform:uppercase}
tr:hover td{background:var(--surface)}
.stat{font-size:28px;font-weight:700;color:var(--gold)}
.err{color:#ef4d5a;margin-top:12px}
.avatar{width:26px;height:26px;border-radius:50%;vertical-align:middle;margin-right:6px}
.detail{white-space:normal;max-width:500px}
.tag{display:inline-block;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-size:11px;color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
  <h1>StudyAI — Admin</h1>
  <div class="sub">Bu sahifa qidiruv tizimlariga ko'rinmaydi, lekin havolani hech kim bilan ulashmang.</div>
  <div>
    <input id="key" type="password" placeholder="Admin parol (ADMIN_KEY)">
    <button onclick="load()">Ko'rish</button>
  </div>
  <div style="margin-top:18px">
    <span class="tab active" id="tab-users" onclick="switchTab('users')">Foydalanuvchilar</span>
    <span class="tab" id="tab-activity" onclick="switchTab('activity')">So'nggi faoliyat</span>
  </div>
  <div id="stat" style="margin-top:16px"></div>
  <div id="err" class="err"></div>
  <div id="tableWrap"></div>
</div>
<script>
let currentView = 'users';
const saved = localStorage.getItem('sai-admin-key');
if (saved) document.getElementById('key').value = saved;

function switchTab(v){
  currentView = v;
  document.getElementById('tab-users').classList.toggle('active', v==='users');
  document.getElementById('tab-activity').classList.toggle('active', v==='activity');
  load();
}

async function load(){
  const key = document.getElementById('key').value.trim();
  if (!key) return;
  localStorage.setItem('sai-admin-key', key);
  document.getElementById('err').textContent = '';
  document.getElementById('stat').textContent = 'Yuklanmoqda…';
  try{
    const r = await fetch('/api/admin?key=' + encodeURIComponent(key) + '&view=' + currentView);
    const d = await r.json();
    if (d.error){ document.getElementById('err').textContent = d.error.message; document.getElementById('stat').textContent=''; document.getElementById('tableWrap').innerHTML=''; return; }

    if (currentView === 'users'){
      document.getElementById('stat').innerHTML = '<span class="stat">' + d.total + '</span> ro\u2019yxatdan o\u2019tgan foydalanuvchi';
      const rows = d.users.map(u => '<tr>' +
        '<td>' + (u.picture ? '<img class="avatar" src="'+u.picture+'">' : '') + (u.name||'') + ' ' + (u.surname||'') + '</td>' +
        '<td>' + (u.email||'—') + '</td>' +
        '<td>' + (u.age||'—') + '</td>' +
        '<td>' + (u.lang||'—') + '</td>' +
        '<td>' + (u.signed_up_at ? new Date(u.signed_up_at).toLocaleString() : '—') + '</td>' +
        '</tr>').join('');
      document.getElementById('tableWrap').innerHTML = d.users.length ?
        '<table><thead><tr><th>Ism</th><th>Email</th><th>Yosh</th><th>Til</th><th>Ro\u2019yxatdan o\u2019tgan</th></tr></thead><tbody>' + rows + '</tbody></table>'
        : '<div class="sub" style="margin-top:16px">Hali hech kim ro\u2019yxatdan o\u2019tmagan.</div>';
    } else {
      document.getElementById('stat').innerHTML = '<span class="stat">' + d.total + '</span> so\u2019nggi harakat (oxirgi 200 tasi)';
      const labels = { chat_message:'Chat', quiz_complete:'Test', task_add:'Vazifa', plan_analysis:'Tahlil', plan_ideal:'Ideal reja' };
      const rows = d.activity.map(a => '<tr>' +
        '<td>' + (a.email||'—') + '</td>' +
        '<td><span class="tag">' + (labels[a.type]||a.type) + '</span></td>' +
        '<td class="detail">' + (a.detail||'') + '</td>' +
        '<td>' + (a.created_at ? new Date(a.created_at).toLocaleString() : '—') + '</td>' +
        '</tr>').join('');
      document.getElementById('tableWrap').innerHTML = d.activity.length ?
        '<table><thead><tr><th>Email</th><th>Turi</th><th>Tafsilot</th><th>Vaqt</th></tr></thead><tbody>' + rows + '</tbody></table>'
        : '<div class="sub" style="margin-top:16px">Hali faoliyat qayd etilmagan.</div>';
    }
  }catch(e){ document.getElementById('err').textContent = e.message; document.getElementById('stat').textContent=''; }
}
if (saved) load();
</script>
</body>
</html>
